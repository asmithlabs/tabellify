<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<!-- Why global.css: it gives the root <window> its background (the system colour
     -moz-Dialog) and the native window look. Without it the root has no background and
     Gecko makes the native window transparent (the see-through window seen on macOS).
     Stylesheet processing instructions must come before <window>.
     Feature 005d (ADR-0015): our brand colours come from tokens.css (design tokens,
     linked in <linkset> below, before workspace.css, which uses them). workspace.css
     paints the page colour on #tabellify-workspace-main, never on the root <window>. -->
<!-- Tabellify workspace (Feature 001 window / Feature 002 tab / Feature 003 data browser /
     Feature 004 codebook / Feature 005 tag monitor / Feature 006a restructure).

     Opened by Tabellify.openWorkspace() as chrome://tabellify/content/workspace.xhtml,
     either inside an <iframe> in a main-window tab or, as a fallback, as its own window.
     The chrome:// URL works because bootstrap.js registers src/content/ as the
     "tabellify" content package.

     - The default namespace is XUL (Mozilla's desktop UI markup); `html:` elements are
       ordinary HTML elements mixed in.
     - `windowtype="tabellify:workspace"` is the label Services.wm uses to find this window
       (single-instance check in openWorkspace, closing it in shutdown).
     - Text comes from Fluent: the <html:link rel="localization"> loads tabellify.ftl, and
       each `data-l10n-id` names the message to show. No user-visible text is hard-coded.
     - Feature 006a (spec docs/features/006a-workspace-restructure.md): one page that reads
       top to bottom like the table it builds. Heading; collection row (dropdown, Refresh,
       "Also count tags on the paper itself", one summary line); the tag script box, the
       group pills and the closed "Edit groups and tags" disclosure; the table toolbar;
       the status messages and the per-paper table. workspace.js fills everything from the
       library (read-only) and from codebooks.json (Tabellify's own file), as plain text. -->
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="tabellify-workspace"
        windowtype="tabellify:workspace"
        data-l10n-id="tabellify-workspace-window">
  <linkset>
    <html:link rel="localization" href="tabellify.ftl"/>
    <!-- tokens.css first: it defines the tabellify colour variables that workspace.css uses. -->
    <html:link rel="stylesheet" href="chrome://tabellify/content/tokens.css"/>
    <html:link rel="stylesheet" href="chrome://tabellify/content/workspace.css"/>
  </linkset>

  <!-- Scripts run in order. include.js (Zotero's own file) defines the global `Zotero`
       object in THIS document, the same shared object the main window uses
       (docs/zotero-api-notes.md, include.js row). It works the same in the tab iframe and
       in the fallback window. codebook-model.js (pure rules), codebook-store.js (file
       load/save, uses the model), tag-script-model.js (F006a: pure parser of the tag script
       box), script-suggest-model.js (F006b: pure suggestion logic for that box, uses the
       parser) and tag-monitor-model.js (pure tag-monitor logic) each define one global that
       workspace.js uses, so they come before it. table-layout-model.js (F005c: pure rules
       for column/row order) and layout-store.js (F005c, ADR-0014: loads and saves
       layout.json, uses the model) also define one global each for workspace.js.
       regroup-model.js (F006c: pure rules for regrouping a dragged tag column) uses the
       codebook, tag-monitor and table-layout models, so it comes after them.
       saved-tables-model.js (F007b, ADR-0018: pure rules for saved tables; uses the
       tag-monitor and table-layout models) and tables-store.js (F007b: loads and saves the
       saved tables file, uses that model) define TabellifySavedTables and TabellifyTablesStore.
       csv-model.js (F008: pure CSV builder) and csv-export.js (F008, ADR-0017: the save
       dialog and the one write of the exported file) define TabellifyCsv and
       TabellifyCsvExport for workspace.js.
       workspace.js only waits for "load" here, so the elements further down exist when it
       starts. -->
  <script src="chrome://zotero/content/include.js"/>
  <script src="chrome://tabellify/content/codebook-model.js"/>
  <script src="chrome://tabellify/content/codebook-store.js"/>
  <script src="chrome://tabellify/content/tag-script-model.js"/>
  <script src="chrome://tabellify/content/script-suggest-model.js"/>
  <script src="chrome://tabellify/content/tag-monitor-model.js"/>
  <script src="chrome://tabellify/content/table-layout-model.js"/>
  <script src="chrome://tabellify/content/regroup-model.js"/>
  <script src="chrome://tabellify/content/layout-store.js"/>
  <script src="chrome://tabellify/content/saved-tables-model.js"/>
  <script src="chrome://tabellify/content/tables-store.js"/>
  <script src="chrome://tabellify/content/csv-model.js"/>
  <script src="chrome://tabellify/content/csv-export.js"/>
  <script src="chrome://tabellify/content/workspace.js"/>

  <html:main id="tabellify-workspace-main">
    <html:h1 data-l10n-id="tabellify-workspace-title"></html:h1>

    <!-- Collection row. "Refresh" re-reads the library at once (live updates also re-read
         it on their own). The checkbox (owner decision 2026-11-13): by default only
         highlight tags count; ticking it also counts tags on the paper item itself.
         workspace.js sets `checked` from the pref extensions.tabellify.countItemTags and
         saves every change. Wrapping the input in the <label> makes the text clickable.
         The summary line (spec Q2) reads "Tags used k/M" and "Papers n"; the dot between
         them is drawn by workspace.css. -->
    <html:div id="tabellify-collection-row">
      <html:label for="tabellify-collection-select"
                  data-l10n-id="tabellify-collection-label"></html:label>
      <!-- Starts disabled; workspace.js enables it once the collections are listed.
           The first option is the placeholder and is never removed. -->
      <html:select id="tabellify-collection-select" disabled="disabled">
        <html:option value="" data-l10n-id="tabellify-collection-placeholder"></html:option>
      </html:select>
      <html:button id="tabellify-monitor-refresh"
                   data-l10n-id="tabellify-monitor-refresh"></html:button>
      <html:label id="tabellify-monitor-count-item-tags-label">
        <html:input id="tabellify-monitor-count-item-tags" type="checkbox"/>
        <html:span data-l10n-id="tabellify-monitor-count-item-tags"></html:span>
      </html:label>
      <html:p id="tabellify-monitor-summary" role="status" hidden="hidden">
        <html:span id="tabellify-monitor-used"></html:span>
        <html:span id="tabellify-monitor-papers"></html:span>
        <html:span id="tabellify-monitor-all-used" hidden="hidden"></html:span>
      </html:p>
    </html:div>
    <html:p id="tabellify-monitor-message"></html:p>
    <html:p id="tabellify-monitor-warning" hidden="hidden"></html:p>

    <!-- Feature 007b (ADR-0018): "Saved tables". A closed <details> disclosure (spec Q3):
         clicking the summary line opens it. The summary reads "Saved tables" and the
         number of entries the filter shows (the dot between them is drawn by
         workspace.css). workspace.js fills the message, the list (one <li> per saved table
         with Open, Export CSV and Delete) and the status line, all as plain text, from
         Tabellify's own saved tables file. The filter is kept only while the tab is open.
         Listeners are delegated on the section. -->
    <html:details id="tabellify-saved">
      <html:summary id="tabellify-saved-summary">
        <html:span data-l10n-id="tabellify-saved-heading"></html:span>
        <html:span id="tabellify-saved-count" hidden="hidden"></html:span>
      </html:summary>
      <html:div id="tabellify-saved-controls">
        <html:label for="tabellify-saved-filter" data-l10n-id="tabellify-saved-filter-label"></html:label>
        <html:select id="tabellify-saved-filter">
          <html:option value="all" data-l10n-id="tabellify-saved-filter-all"></html:option>
          <html:option value="collection" data-l10n-id="tabellify-saved-filter-collection"></html:option>
        </html:select>
      </html:div>
      <html:p id="tabellify-saved-message" hidden="hidden">
        <html:span id="tabellify-saved-message-text"></html:span>
        <html:code id="tabellify-saved-message-path" hidden="hidden"></html:code>
      </html:p>
      <html:ul id="tabellify-saved-list" aria-labelledby="tabellify-saved-summary"></html:ul>
      <html:p id="tabellify-saved-status" role="status" hidden="hidden">
        <html:span id="tabellify-saved-status-text"></html:span>
        <html:code id="tabellify-saved-status-path" hidden="hidden"></html:code>
      </html:p>
    </html:details>

    <!-- Codebook (Feature 004, restructured in 006a). The <fieldset> holds every editing
         control, so setting its `disabled` turns them all off at once (while saving, or
         when the file could not be loaded). Listeners are delegated on the section.

         Tag script box: one line such as "Exposure(heat index, temperature), age"; Enter
         adds it to the codebook (never to the Zotero library). The help line and the error
         line describe the box (aria-describedby); the error line has role="alert" so a
         screen reader reads it out when it appears.

         Feature 006b: the box is a WAI-ARIA "combobox" (a text box with a list of
         choices). While typing, workspace.js fills the <ul role="listbox"> under it with
         suggestions (library tags, group names, "Create tag"), one <li role="option"> each,
         as plain text. The keyboard focus stays in the box; aria-activedescendant on the
         box names the highlighted option, aria-expanded says whether the list is open.
         autocomplete="off" turns off the browser's own form-history dropdown.

         Group pills: one <li> per group ("Outcome · 3") in the table's column order,
         filled by workspace.js. Not interactive.

         "Edit groups and tags" (spec Q1): a closed <details> disclosure. Clicking its
         <summary> line opens it; no JavaScript is needed for that. Inside, workspace.js
         lists each group with Rename and Delete, each tag with its remove button. -->
    <html:section id="tabellify-codebook">
      <html:fieldset id="tabellify-codebook-controls" disabled="disabled">
        <html:div id="tabellify-script-box">
          <html:label id="tabellify-script-label" for="tabellify-script-input"
                      data-l10n-id="tabellify-script-label"></html:label>
          <html:input id="tabellify-script-input" type="text" data-action="script-input"
                      autocomplete="off" spellcheck="false"
                      role="combobox" aria-autocomplete="list" aria-expanded="false"
                      aria-controls="tabellify-script-suggestions"
                      aria-describedby="tabellify-script-help tabellify-script-error"/>
          <html:ul id="tabellify-script-suggestions" role="listbox" hidden="hidden"></html:ul>
          <html:p id="tabellify-script-help" data-l10n-id="tabellify-script-help"></html:p>
          <html:p id="tabellify-script-error" role="alert" hidden="hidden"></html:p>
          <html:p id="tabellify-codebook-status" role="status" hidden="hidden">
            <html:span id="tabellify-codebook-status-text"></html:span>
            <html:code id="tabellify-codebook-status-path" hidden="hidden"></html:code>
          </html:p>
        </html:div>
        <html:ul id="tabellify-group-pills" hidden="hidden"></html:ul>
        <html:details id="tabellify-codebook-editor">
          <html:summary data-l10n-id="tabellify-codebook-edit"></html:summary>
          <html:div id="tabellify-codebook-groups"></html:div>
        </html:details>
      </html:fieldset>
    </html:section>

    <!-- Feature 005c: table toolbar, shown together with the table. "Manual order" and
         "Clear manual order" appear once the chosen collection has a hand-made paper
         order; "Manual order" has aria-pressed="true" while that order is shown.
         The last element is visually hidden: workspace.js writes a short plain-text
         message into it after each keyboard move, and role="status" makes screen readers
         (VoiceOver) read it out. -->
    <html:div id="tabellify-table-toolbar" hidden="hidden">
      <html:button id="tabellify-table-reset-columns" data-action="reset-columns"
                   data-l10n-id="tabellify-table-reset-columns"></html:button>
      <!-- Feature 006c: while a tag column is dragged over a valid place, workspace.js
           writes what the drop will do here as plain text (for example "Move into group:"
           and the group name). Mouse feedback only, so hidden from screen readers. -->
      <html:span id="tabellify-drop-hint" aria-hidden="true" hidden="hidden"></html:span>
      <html:button id="tabellify-table-manual-order" data-action="manual-order"
                   aria-pressed="false" hidden="hidden"
                   data-l10n-id="tabellify-table-manual-order"></html:button>
      <html:button id="tabellify-table-clear-manual" data-action="clear-manual"
                   hidden="hidden"
                   data-l10n-id="tabellify-table-clear-manual"></html:button>
      <html:span id="tabellify-table-announce" class="tabellify-visually-hidden"
                 role="status" aria-live="polite"></html:span>
    </html:div>
    <!-- Feature 005c (ADR-0014): problems with the saved layout file layout.json (could
         not be read, made by a newer Tabellify, could not be saved, changed in another
         tab). Filled by workspace.js with plain text; the file path follows in <code>. -->
    <html:p id="tabellify-layout-status" role="status" hidden="hidden">
      <html:span id="tabellify-layout-status-text"></html:span>
      <html:code id="tabellify-layout-status-path" hidden="hidden"></html:code>
    </html:p>

    <!-- Status messages: workspace.js removes `hidden` from at most one of them. -->
    <html:p id="tabellify-no-collections" class="tabellify-status" hidden="hidden"
            data-l10n-id="tabellify-no-collections"></html:p>
    <html:p id="tabellify-loading-items" class="tabellify-status" hidden="hidden"
            data-l10n-id="tabellify-loading-items"></html:p>
    <html:p id="tabellify-no-items" class="tabellify-status" hidden="hidden"
            data-l10n-id="tabellify-no-items"></html:p>
    <html:p id="tabellify-load-error" class="tabellify-status" hidden="hidden"
            data-l10n-id="tabellify-load-error"></html:p>

    <!-- Per-paper table (F005; replaces the F003 item list). Owner decision 2026-11-13:
         columns are grip, Title, one column per codebook tag grouped under its super-tag,
         then k/M. The header has two rows: the first holds the group headers (each spans
         its tags), the second the tag headers. workspace.js builds the group and tag
         header cells and the <col> elements (which set the column widths) from the
         codebook, as plain text; the fixed cells below span both rows.

         Header buttons carry data-sort (TabellifyTagMonitor.SORT_KEYS, or a tag column's
         key); workspace.js sets aria-sort on the <th> of the active column. The Fluent ID
         sits on the button, not on the <th>, because Fluent replaces the children of the
         element it translates.

         Feature 005c: each group and tag header gets a grip (a <span>, not a <button>:
         Firefox does not start a drag from a draggable <button>, Mozilla bug 568313).
         A tag column moves only inside its group; a group header moves the whole group.
         Title and k/M never move. The first column holds each paper's row grip.

         Feature 005d: class="tabellify-grid" carries the shared table style
         (workspace.css), so a later table (F006) can reuse it.

         Feature 006a (ADR-0016): tags without a group form one block whose group header
         is blank (it still spans its tags and has a grip). When no real group has
         columns, the header is a single row: the tag headers go into the first row and
         the second row is hidden. -->
    <html:table id="tabellify-items-table" class="tabellify-grid" hidden="hidden">
      <html:colgroup id="tabellify-items-cols"></html:colgroup>
      <html:thead>
        <html:tr id="tabellify-items-group-row" class="tabellify-group-row">
          <html:th scope="col" rowspan="2" class="tabellify-col-grip tabellify-fixed-header"
                   data-l10n-id="tabellify-column-move"></html:th>
          <html:th scope="col" rowspan="2" class="tabellify-col-title tabellify-fixed-header">
            <html:button class="tabellify-sort" data-sort="title"
                         data-l10n-id="tabellify-column-title"></html:button>
          </html:th>
          <html:th id="tabellify-items-count-header" scope="col" rowspan="2"
                   class="tabellify-col-count tabellify-fixed-header">
            <html:button class="tabellify-sort" data-sort="count"
                         data-l10n-id="tabellify-column-count"></html:button>
          </html:th>
        </html:tr>
        <html:tr id="tabellify-items-tag-row" class="tabellify-tag-row"></html:tr>
      </html:thead>
      <html:tbody id="tabellify-items-body"></html:tbody>
    </html:table>

    <!-- Feature 008 (ADR-0017): actions under the table. Shown and hidden together with
         the table. "Export CSV" opens the system save dialog and saves exactly what the
         table shows; workspace.js disables the button while an export runs. The status
         line says where the file was saved (the path follows in <code>, as plain text)
         or why it was not; a cancelled dialog shows nothing.
         Feature 007a: "View table" (left of "Export CSV") opens the modal below.
         aria-haspopup="dialog" tells screen readers that the button opens a dialog. -->
    <html:div id="tabellify-table-actions" hidden="hidden">
      <html:button id="tabellify-view-table" data-l10n-id="tabellify-view-table"
                   aria-haspopup="dialog"></html:button>
      <html:button id="tabellify-export-csv" data-l10n-id="tabellify-export-csv"></html:button>
      <html:p id="tabellify-export-status" role="status" hidden="hidden">
        <html:span id="tabellify-export-status-text"></html:span>
        <html:code id="tabellify-export-status-path" hidden="hidden"></html:code>
      </html:p>
    </html:div>

    <!-- Feature 007a: the "View table" modal (spec docs/features/007a-view-table.md).
         An HTML <dialog>: workspace.js opens it with showModal(), which shows it in front
         of the page, dims the page behind it (the browser's own backdrop) and makes the
         rest of THIS document inert (not clickable, not reachable with Tab). Zotero's own
         window around the tab stays usable, so workspace.js keeps Tab inside the dialog
         itself. Esc and "Close" close it.
         No form with method="dialog": Enter in the Name field must not close the dialog.
         Name and Description are kept only in memory while the tab is open (not saved).
         The table is a clean read-only copy built by workspace.js as plain text (no sort
         buttons, no grips). The scroll area has tabindex="0" so the keyboard can reach it
         and scroll it with the arrow keys; its Fluent message sets only aria-label.
         "Export CSV" here uses the Name as the suggested file name; the result shows in
         the dialog's own status line.
         Feature 007b: the same dialog also shows a SAVED table (saved mode). The heading
         and the first button change text with the mode, so workspace.js sets their text
         (no data-l10n-id). "Save table" (draft) keeps the table in Tabellify's own file;
         in saved mode the button reads "Save changes" and saves Name and Description.
         The muted meta line under the heading names the snapshot's date and collection. -->
    <html:dialog id="tabellify-view-dialog" aria-labelledby="tabellify-view-heading">
      <html:h2 id="tabellify-view-heading"></html:h2>
      <html:p id="tabellify-view-meta" hidden="hidden"></html:p>
      <html:p id="tabellify-view-note" data-l10n-id="tabellify-view-not-saved"></html:p>
      <html:div id="tabellify-view-fields">
        <html:label for="tabellify-view-name" data-l10n-id="tabellify-view-name-label"></html:label>
        <html:input id="tabellify-view-name" type="text" maxlength="200" autocomplete="off"
                    aria-describedby="tabellify-view-name-help"/>
        <html:p id="tabellify-view-name-help" data-l10n-id="tabellify-view-name-help"></html:p>
        <html:label for="tabellify-view-description"
                    data-l10n-id="tabellify-view-description-label"></html:label>
        <html:textarea id="tabellify-view-description" rows="3" maxlength="2000"></html:textarea>
      </html:div>
      <html:div id="tabellify-view-scroll" role="region" tabindex="0"
                data-l10n-id="tabellify-view-table-region">
        <html:table id="tabellify-view-grid" class="tabellify-grid">
          <html:thead id="tabellify-view-head"></html:thead>
          <html:tbody id="tabellify-view-body"></html:tbody>
        </html:table>
      </html:div>
      <html:div id="tabellify-view-actions">
        <html:button id="tabellify-view-save"></html:button>
        <html:button id="tabellify-view-export" data-l10n-id="tabellify-export-csv"></html:button>
        <html:button id="tabellify-view-close" data-l10n-id="tabellify-view-close"></html:button>
        <html:p id="tabellify-view-export-status" role="status" hidden="hidden">
          <html:span id="tabellify-view-export-status-text"></html:span>
          <html:code id="tabellify-view-export-status-path" hidden="hidden"></html:code>
        </html:p>
      </html:div>
    </html:dialog>
  </html:main>
</window>
